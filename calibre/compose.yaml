networks:
  public:
    external: true

services:
  web:
    container_name: calibre-web
    environment:
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      - TZ=${TZ:-America/Los_Angeles}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    healthcheck:
      start_period: 20s
      test:
        - 'CMD'
        - 'curl'
        - '-f'
        - 'http://localhost:8083/'
    image: ghcr.io/linuxserver/calibre-web:${IMAGE_TAG:-latest}
    labels:
      homepage.group: Media
      homepage.href: https://${HOST:-calibre.${BASE_DOMAIN}}
      homepage.icon: calibre-web.png
      homepage.name: Calibre Web
      traefik.enable: true
      traefik.http.routers.calibre.middlewares: 'authelia@docker'
      traefik.http.routers.calibre.rule: Host(`${HOST:-calibre.${BASE_DOMAIN}}`)
      traefik.http.routers.calibre.tls: true
      traefik.http.services.calibre.loadbalancer.server.port: 8083
    networks:
      - public
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/mnt/pool0/containers}/calibre/data:/config
      - ${MEDIA_DIR:-/mnt/pool1/media}/library/calibre:/books
