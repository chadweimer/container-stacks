networks:
  public:
    external: true

services:
  jellyfin:
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri
    environment:
      JELLYFIN_PublishedServerUrl: https://${HOST:-jellyfin.${BASE_DOMAIN}}
      TZ: ${TZ:-America/Los_Angeles}
    group_add:
      - 107 # render
      - 44 # video
    image: ghcr.io/jellyfin/jellyfin:${IMAGE_TAG:-latest}
    labels:
      homepage.group: Media
      homepage.href: https://${HOST:-jellyfin.${BASE_DOMAIN}}
      homepage.icon: jellyfin.png
      homepage.name: Jellyfin
      traefik.enable: true
      traefik.http.routers.jellyfin.rule: Host(`${HOST:-jellyfin.${BASE_DOMAIN}}`)
      traefik.http.routers.jellyfin.tls: true
    networks:
      - public
    pull_policy: always
    restart: unless-stopped
    user: '${PUID:-568}:${PGID:-568}'
    volumes:
      - ${MEDIA_DIR:-/mnt/pool1/media}/library:/data/library
      - ${DATA_DIR:-/mnt/pool0/containers}/jellyfin/cache:/cache
      - ${DATA_DIR:-/mnt/pool0/containers}/jellyfin:/config
