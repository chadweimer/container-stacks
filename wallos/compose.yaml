networks:
  public:
    external: true

services:
  wallos:
    container_name: wallos
    environment:
      PGID: ${PGID:-568}
      PUID: ${PUID:-568}
      TZ: ${TZ:-America/Los_Angeles}
    image: ghcr.io/ellite/wallos:${IMAGE_TAG:-latest}
    labels:
      homepage.group: Other
      homepage.href: https://${HOST:-wallos.${BASE_DOMAIN}}
      homepage.icon: wallos.png
      homepage.name: Wallos (Subscriptions)
      homepage.widget.fields: '["activeSubscriptions", "thisMonthlyCost", "nextMonthlyCost"]'
      homepage.widget.key: ${API_KEY}
      homepage.widget.type: wallos
      homepage.widget.url: http://wallos
      traefik.enable: true
      traefik.http.routers.wallos.middlewares: 'authelia@docker'
      traefik.http.routers.wallos.rule: Host(`${HOST:-wallos.${BASE_DOMAIN}}`)
      traefik.http.routers.wallos.tls: true
    networks:
      - public
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/mnt/pool0/containers}/wallos/db:/var/www/html/db
      - ${DATA_DIR:-/mnt/pool0/containers}/wallos/logos:/var/www/html/images/uploads/logos
