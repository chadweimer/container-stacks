networks:
  docker-proxy:
    external: true
  observe:
    external: true
  public:
    external: true

services:
  homepage:
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOST:-home.${BASE_DOMAIN}}
      PGID: ${PGID:-568}
      PUID: ${PUID:-568}
    extra_hosts:
      - host.docker.internal:host-gateway
    image: ghcr.io/gethomepage/homepage:${IMAGE_TAG:-latest}
    labels:
      traefik.enable: true
      traefik.http.routers.homepage.rule: Host(`${HOST:-home.${BASE_DOMAIN}}`)
      traefik.http.routers.homepage.tls: true
    networks:
      - docker-proxy
      - observe
      - public
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/mnt/pool0/containers}/homepage:/app/config
