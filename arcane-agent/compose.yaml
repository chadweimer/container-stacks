name: arcane-agent

services:
  arcane-agent:
    container_name: arcane-agent
    environment:
      ARCANE_AGENT: true
      ARCANE_AGENT_TOKEN: ${ARCANE_AGENT_TOKEN}
      ARCANE_MANAGER_API_URL: ${ARCANE_MANAGER_API_URL}
    image: ghcr.io/getarcaneapp/agent:${IMAGE_TAG:-latest}
    ports:
      - '3553:3553'
    pull_policy: always
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data

volumes:
  arcane-data:
