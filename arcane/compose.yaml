networks:
  arcane:
    name: arcane
  public:
    external: true

services:
  arcane:
    container_name: arcane
    environment:
      ARCANE_APP_URL: https://${HOST:-arcane.${BASE_DOMAIN}}
      ARCANE_ENCRYPTION_KEY: ${ARCANE_ENCRYPTION_KEY}
      ARCANE_LOG_JSON: true
      DOCKER_HOST: tcp://arcane-proxy:2375
      PGID: ${PGID:-568}
      PUID: ${PUID:-568}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 15s
      test:
        - 'CMD'
        - 'curl'
        - '-fsS'
        - 'http://localhost:3552/api/health'
      timeout: 3s
    image: ghcr.io/getarcaneapp/manager:${IMAGE_TAG:-latest}
    labels:
      com.getarcaneapp.arcane.updater: false
      homepage.group: Network
      homepage.href: https://${HOST:-arcane.${BASE_DOMAIN}}
      homepage.icon: arcane.png
      homepage.name: Arcane
      traefik.enable: true
      traefik.http.routers.arcane.rule: Host(`${HOST:-arcane.${BASE_DOMAIN}}`)
      traefik.http.routers.arcane.tls: true
      traefik.http.services.arcane.loadbalancer.server.port: 3552
    networks:
      - arcane
      - public
    ports:
      - 3552:3552 # For access when traefik is not up
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/mnt/pool0/containers}/arcane/data:/app/data
      - ${DATA_DIR:-/mnt/pool0/containers}/arcane/data/projects:/app/data/projects
  arcane-proxy:
    container_name: arcane-proxy
    environment:
      ALLOW_ARCHIVE: '1'
      ALLOW_CHANGES: '1'
      ALLOW_LOGS: '1'
      ALLOW_RESTARTS: '1'
      ALLOW_START: '1'
      ALLOW_STOP: '1'
      ALLOW_TOP: '1'
      AUTH: '1'
      CONFIGS: '1'
      CONTAINERS: '1'
      DISTRIBUTION: '1'
      EVENTS: '1'
      EXEC: '1'
      IMAGES: '1'
      INFO: '1'
      NETWORKS: '1'
      PING: '1'
      POST: '1'
      SECRETS: '1'
      SYSTEM: '1'
      VERSION: '1'
      VOLUMES: '1'
    healthcheck:
      start_period: 5s
      test:
        - 'CMD'
        - 'wget'
        - '--spider'
        - '-q'
        - '--tries=1'
        - 'http://localhost:2375/_ping'
    image: ghcr.io/linuxserver/socket-proxy:${DOCKER_PROXY_IMAGE_TAG:-latest}
    labels:
      com.getarcaneapp.arcane.updater: false
    networks:
      - arcane
    pull_policy: always
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
