networks:
  docker-proxy:
    external: true
  observe:
    external: true
  public:
    external: true

services:
  uptime-kuma:
    container_name: uptime-kuma
    image: ghcr.io/louislam/uptime-kuma:${IMAGE_TAG:-2}-slim
    labels:
      homepage.group: Status
      homepage.href: https://${HOST:-uptime-kuma.${BASE_DOMAIN}}
      homepage.icon: uptime-kuma.png
      homepage.name: Home Status
      homepage.widget.slug: home
      homepage.widget.type: uptimekuma
      homepage.widget.url: http://uptime-kuma:3001
      prometheus.port: 3001
      traefik.enable: true
      traefik.http.routers.uptime.middlewares: 'authelia@docker'
      traefik.http.routers.uptime.rule: Host(`${HOST:-uptime-kuma.${BASE_DOMAIN}}`)
      traefik.http.routers.uptime.tls: true
    networks:
      - docker-proxy
      - observe
      - public
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/mnt/pool0/containers}/uptime-kuma:/app/data
